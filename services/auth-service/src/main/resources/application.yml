server:
  port: 8081

spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/daw}
    username: ${DB_USERNAME:daw}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks it matches the entities.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
  flyway:
    schemas: auth
    default-schema: auth

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

daw:
  jwt:
    issuer: daw-auth
    ttl: 15m
    # public-key / private-key: PEM locations, e.g. DAW_JWT_PUBLIC_KEY=file:/etc/daw/jwt/public.pem
