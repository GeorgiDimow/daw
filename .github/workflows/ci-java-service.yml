# Reusable CI for a Spring Boot service in services/<service>.
# Test -> build image -> scan -> SBOM; on main also push to GHCR and sign.
name: ci-java-service

on:
  workflow_call:
    inputs:
      service:
        description: Directory name under services/, e.g. auth-service
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Unit tests, Testcontainers integration tests (Flyway against real Postgres), coverage gate.
      - name: Test
        run: ./gradlew :services:${{ inputs.service }}:check --console=plain

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-reports
          path: services/${{ inputs.service }}/build/reports/
          retention-days: 14

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR (main only)
      id-token: write # keyless cosign signing (main only)
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/daw-${{ inputs.service }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ inputs.service }}/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          artifact-name: ${{ inputs.service }}-sbom.spdx.json

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ inputs.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ inputs.service }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'

      - name: Sign image (keyless)
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
